services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bimipal_dev_bot
    restart: unless-stopped

    ports:
      - "18083:18080"

    volumes:
      - .:/app

    env_file:
      - .env.dev

    environment:
      - TZ=Europe/Kyiv
      - ENV_FILE=.env.dev

    networks:
      - dev_network

networks:
  dev_network:
    external: true
    name: bimi_dev_network
